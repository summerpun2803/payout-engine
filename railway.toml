[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "gunicorn payout_engine.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
healthcheckPath = "/api/v1/merchant/balance"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
